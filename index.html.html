<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Message</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Digital font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#040404;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Orbitron', monospace;
}

/* billboard depth */
.billboard{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,0,0,0.06), transparent 55%),
    #050505;
}

/* LED dot texture */
.billboard::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(rgba(0,0,0,0.6) 1px, transparent 1px);
  background-size:6px 6px;
  opacity:0.5;
  pointer-events:none;
}

/* scrolling area */
.marquee{
  position:absolute;
  width:100%;
  white-space:nowrap;
  overflow:hidden;
}

/* movement */
.track{
  display:inline-block;
  padding-left:100%;
  animation:scroll 35s linear infinite;
}

/* LED text */
.text{
  font-size:clamp(3rem, 12vw, 8rem);
  letter-spacing:6px;
  color:#ff0000;
  text-shadow:
    0 0 8px rgba(255,0,0,0.6),
    0 0 18px rgba(255,0,0,0.4),
    0 0 30px rgba(255,0,0,0.25);
  animation:glitch 5s infinite, pulse 2s infinite alternate;
  background:
    radial-gradient(circle at center, #ff0000 50%, transparent 51%) 0 0 / 8px 8px repeat;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

/* blinking cursor */
.cursor{
  margin-left:8px;
  animation:blink 1s steps(1) infinite;
}

/* animations */
@keyframes scroll{
  from{transform:translateX(0);}
  to{transform:translateX(-100%);}
}

@keyframes blink{
  50%{opacity:0;}
}

@keyframes glitch{
  0%,96%,100%{transform:none;}
  97%{transform:translateX(1px);}
  98%{transform:translateX(-1px);}
  99%{opacity:0.85;}
}

@keyframes pulse{
  0%{
    text-shadow:
      0 0 6px rgba(255,0,0,0.5),
      0 0 12px rgba(255,0,0,0.3),
      0 0 20px rgba(255,0,0,0.2);
  }
  100%{
    text-shadow:
      0 0 10px rgba(255,0,0,0.8),
      0 0 20px rgba(255,0,0,0.5),
      0 0 40px rgba(255,0,0,0.3);
  }
}

/* flicker effect */
.flicker{
  animation:glitch 0.2s 3;
}
</style>
</head>

<body>

<div class="billboard"></div>

<div class="marquee">
  <div class="track" id="track">
    <span class="text" id="ledText">
      WILL YOU BE MY VALENTINE?
      <span class="cursor">▍</span>
    </span>

    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

    <span class="text">
      WILL YOU BE MY VALENTINE?
      <span class="cursor">▍</span>
    </span>
  </div>
</div>

<!-- Background music -->
<audio id="backgroundMusic" src="kilby-girl.mp3" loop></audio>

<script>
const track = document.getElementById('track');
const ledText = document.getElementById('ledText');
const music = document.getElementById('backgroundMusic');

let musicStarted = false;
let paused = false;

document.body.addEventListener('click', () => {

  // Start music on first click (browser autoplay rule)
  if(!musicStarted){
    music.volume = 0.3;
    music.play().catch(() => console.log("Music blocked"));
    musicStarted = true;
    return;
  }

  // Flicker effect
  ledText.classList.add('flicker');
  setTimeout(() => ledText.classList.remove('flicker'), 600);

  // Toggle scrolling
  if(!paused){
    track.style.animationPlayState = 'paused';
    paused = true;
  } else {
    track.style.animationPlayState = 'running';
    paused = false;
  }
});
</script>

</body>
</html>
